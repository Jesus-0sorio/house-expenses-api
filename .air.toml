root = "."
tmp_dir = "tmp"

[build]
cmd = "go build -o ./tmp/main ./cmd/api"
bin = "./tmp/main"
full_bin = ""
include_ext = ["go"]
exclude_dir = ["assets", "tmp", "vendor", "apps", "services", ".git", "node_modules", "openspec"]
include_dir = ["cmd", "internal"]
exclude_regex = ["_test\\.go$"]
delay = 500
stop_on_error = true

[color]
main = "magenta"
watcher = "cyan"
build = "yellow"
runner = "green"

[misc]
clean_on_exit = true
