services:
  api:
    build:
      context: .
      dockerfile: Dockerfile.dev
    ports:
      - "8080:8080"
    volumes:
      - .:/app
    environment:
      - DB_DRIVER=postgres
      - DB_DSN=
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_USER=expenses
      - DB_PASSWORD=expenses_secret
      - DB_NAME=house_expenses
      - DB_SSLMODE=disable
      - JWT_SECRET=super_secret_dev_key_2026
      - DIAN_SERVICE_URL=http://dian-service:8081
      - GIN_MODE=debug
    depends_on:
      postgres:
        condition: service_healthy
      dian-service:
        condition: service_started

  dian-service:
    build:
      context: ./services/dian-service
      dockerfile: Dockerfile.dev
    ports:
      - "8081:8081"
    volumes:
      - ./services/dian-service:/app
    environment:
      - PORT=8081
      - DIAN_CATALOG_BASE_URL=https://catalogo-vpfe.dian.gov.co
      - GIN_MODE=debug

  postgres:
    image: postgres:16-alpine
    restart: always
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=expenses
      - POSTGRES_PASSWORD=expenses_secret
      - POSTGRES_DB=house_expenses
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U expenses -d house_expenses"]
      interval: 3s
      timeout: 3s
      retries: 5
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:

